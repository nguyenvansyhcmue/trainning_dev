services:
  api:
    build:
      context: ..
      dockerfile: w7/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: w5-demo-secret-key-change-this-in-production-123456
      Jwt__Issuer: w5-api
      Jwt__Audience: w5-client
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
